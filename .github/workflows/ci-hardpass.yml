name: CI Hardpass RSVP/CSV

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hardpass-rsvp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --quiet

      - name: File-size guard
        run: npm run guard:file-size

      - name: Asset budget guard
        run: npm run guard:assets

      - name: Security regression tests
        run: npm run test:security

      - name: Public access coverage proof
        run: npm run proof:v1:public-access-coverage

      - name: Unit and regression tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Performance budget proof
        run: npm run proof:v1:performance-budget

      - name: Registry smoke
        run: npm run smoke:registry

      - name: CSV mapper smoke
        run: npm run smoke:csvmapper

      - name: Check-in smoke
        run: npm run smoke:checkin

      - name: Messages smoke
        run: npm run smoke:messages

      - name: Hardpass RSVP strict (Supabase-backed)
        if: ${{ env.VITE_SUPABASE_URL != '' && env.VITE_SUPABASE_ANON_KEY != '' }}
        run: npm run smoke:rsvp:strict

      - name: RSVP strict skipped notice
        if: ${{ env.VITE_SUPABASE_URL == '' || env.VITE_SUPABASE_ANON_KEY == '' }}
        run: echo "Skipping smoke:rsvp:strict (missing VITE_SUPABASE_URL/VITE_SUPABASE_ANON_KEY secrets)."
