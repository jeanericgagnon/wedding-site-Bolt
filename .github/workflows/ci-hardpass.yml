name: CI Hardpass RSVP/CSV

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hardpass-rsvp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      V1_OWNER_EMAIL: ${{ secrets.V1_OWNER_EMAIL }}
      V1_OWNER_PASSWORD: ${{ secrets.V1_OWNER_PASSWORD }}
      LIVE_GUEST_DASHBOARD_SETTINGS_RPCS: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Require launch proof secrets
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ] || [ -z "$V1_OWNER_EMAIL" ] || [ -z "$V1_OWNER_PASSWORD" ]; then
            echo "::error::Missing VITE_SUPABASE_URL/VITE_SUPABASE_ANON_KEY/V1_OWNER_EMAIL/V1_OWNER_PASSWORD secrets required for launch proof."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Strict pocket proof
        run: npm run proof:v1:strict-pocket

      - name: Lint
        run: npm run lint -- --quiet

      - name: File-size guard
        run: npm run guard:file-size

      - name: Asset budget guard
        run: npm run guard:assets

      - name: Security regression tests
        run: npm run test:security

      - name: Public access coverage proof
        run: npm run proof:v1:public-access-coverage

      - name: Client write inventory proof
        run: npm run proof:v1:client-write-inventory

      - name: AST security proof
        run: npm run proof:v1:ast-security

      - name: Security automation proof
        run: npm run proof:v1:security-automation

      - name: Live client RLS matrix proof
        run: npm run proof:v1:client-rls-matrix -- --require-live

      - name: Unit and regression tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Performance budget proof
        run: npm run proof:v1:performance-budget

      - name: Registry smoke
        run: npm run smoke:registry

      - name: CSV mapper smoke
        run: npm run smoke:csvmapper

      - name: Check-in smoke
        run: npm run smoke:checkin

      - name: Messages smoke
        run: npm run smoke:messages

      - name: Hardpass RSVP strict (Supabase-backed)
        run: npm run smoke:rsvp:strict
