<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/dayof-calendar-mark.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FAFAF8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dayof</title>
    <meta name="description" content="A calm wedding home for your site, guests, memories, and planning." />
    <meta property="og:title" content="dayof" />
    <meta property="og:description" content="A calm wedding home for your site, guests, memories, and planning." />
    <meta property="og:image" content="/image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/image.png" />
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('oc_redirect');
        if (!redirect) return;
        var segs = window.location.pathname.split('/').filter(Boolean);
        var base = window.location.hostname.endsWith('github.io') && segs.length > 0 ? '/' + segs[0] : '';
        var target = base + (redirect.startsWith('/') ? redirect : '/' + redirect);
        window.history.replaceState(null, '', target);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
